apiVersion: v3.1.0
kind: DataContract
id: urn:orqentis:orqentis:healthcare:patient_encounters:v1
name: Patient Encounters Contract
version: 1.0.0
status: active
description:
  purpose: Patient encounter Delta table contract for the clinical lakehouse.
  usage: Primary source for downstream analytics and AI models.
servers:
  - server: fabric-production
    type: azure
    location: abfss://clinical@onelake.dfs.fabric.microsoft.com/ClinicalLakehouse.Lakehouse/Tables/patient_encounters
    format: delta
schema:
  - name: patient_encounters
    physicalType: table
    description: Governs the patient_encounters Delta table in the PORS Clinical Lakehouse.
    properties:
      - name: encounter_id
        logicalType: string
        physicalType: STRING
        required: true
        unique: true
        description: Unique encounter identifier (UUID format)
        customProperties:
          - property: pii
            value: false
      - name: patient_id
        logicalType: string
        physicalType: STRING
        required: true
        description: De-identified patient reference
        customProperties:
          - property: pii
            value: false
      - name: encounter_date
        logicalType: date
        physicalType: DATE
        required: true
        partitionKeyPosition: 1
        description: Date of clinical encounter (YYYY-MM-DD)
        customProperties:
          - property: pii
            value: false
      - name: diagnosis_code
        logicalType: string
        physicalType: STRING
        description: ICD-10 diagnosis code
        customProperties:
          - property: pii
            value: false
      - name: facility_id
        logicalType: string
        physicalType: STRING
        required: true
        description: Healthcare facility identifier
        customProperties:
          - property: pii
            value: false
slaProperties:
  - property: availability
    value: 99.5
    unit: percent
  - property: latency
    value: 25
    unit: hours
customProperties:
  - property: orqentisInfo
    value:
      title: Patient Encounters
      description: Governs the patient_encounters Delta table in the PORS Clinical Lakehouse. This table is the primary source for downstream analytics and AI models.
      owner: clinical-data-team@example.com
      contact:
        - name: Data Platform Team
          email: dataplatform@example.com
          role: producer
        - name: Analytics Team
          email: analytics@example.com
          role: consumer
  - property: orqentisQuality
    value:
      - type: nullRate
        column: encounter_id
        threshold: 0.0
        severity: error
      - type: nullRate
        column: encounter_date
        threshold: 0.001
        severity: error
      - type: uniqueness
        column: encounter_id
        threshold: 1.0
        severity: error
      - type: regex
        column: diagnosis_code
        pattern: '^[A-Z][0-9]{2}(.[0-9]{1,4})?$'
        threshold: 0.95
        severity: warning
  - property: orqentisFreshness
    value:
      maxAgeHours: 25
      severity: warning
