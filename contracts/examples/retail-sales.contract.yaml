apiVersion: v3.1.0
kind: DataContract
id: urn:orqentis:orqentis:retail:sales_transactions:v1
name: Retail Sales Transactions Contract
version: 1.0.0
status: active
description:
  purpose: Governs the sales_transactions Delta table in the Retail Analytics Lakehouse.
  usage: Source of truth for revenue dashboards and demand forecasting.
servers:
  - server: fabric-production
    type: azure
    location: abfss://retail@onelake.dfs.fabric.microsoft.com/RetailLakehouse.Lakehouse/Tables/sales_transactions
    format: delta
schema:
  - name: sales_transactions
    physicalType: table
    description: Retail sales transaction records at line-item grain.
    properties:
      - name: transaction_id
        logicalType: string
        physicalType: STRING
        required: true
        unique: true
        description: Unique POS transaction identifier.
      - name: store_id
        logicalType: string
        physicalType: STRING
        required: true
        description: Originating store code.
      - name: customer_id
        logicalType: string
        physicalType: STRING
        required: false
        description: Loyalty customer identifier (nullable).
        customProperties:
          - property: pii
            value: true
      - name: transaction_ts
        logicalType: timestamp
        physicalType: TIMESTAMP
        required: true
        description: Transaction timestamp in UTC.
      - name: sku
        logicalType: string
        physicalType: STRING
        required: true
        description: Product SKU at time of sale.
      - name: quantity
        logicalType: integer
        physicalType: INTEGER
        required: true
        description: Units sold.
      - name: unit_price
        logicalType: number
        physicalType: DECIMAL
        required: true
        description: Per-unit price in AUD.
      - name: total_amount
        logicalType: number
        physicalType: DECIMAL
        required: true
        description: Line total after discount.
      - name: payment_method
        logicalType: string
        physicalType: STRING
        required: true
        description: Payment channel used for settlement.
slaProperties:
  - property: availability
    value: 99.9
    unit: percent
  - property: latency
    value: 6
    unit: hours
customProperties:
  - property: orqentisInfo
    value:
      title: Retail Sales Transactions
      description: Governance contract for sales transaction quality and freshness.
      owner: retail-data-team@example.com
      contact:
        - name: Retail Data Platform
          email: retail-platform@example.com
          role: producer
        - name: Finance Analytics
          email: finance-analytics@example.com
          role: consumer
  - property: orqentisQuality
    value:
      - type: nullRate
        column: transaction_id
        threshold: 0.0
        severity: error
      - type: uniqueness
        column: transaction_id
        threshold: 1.0
        severity: error
      - type: nullRate
        column: total_amount
        threshold: 0.0
        severity: error
      - type: custom_sql
        sql: SELECT COUNT(*) FROM sales_transactions WHERE total_amount < 0
        threshold: 0
        severity: error
      - type: regex
        column: payment_method
        pattern: ^(CASH|CARD|DIGITAL_WALLET|GIFT_CARD)$
        threshold: 1.0
        severity: error
  - property: orqentisFreshness
    value:
      maxAgeHours: 6
      severity: error
