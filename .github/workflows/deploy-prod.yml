name: Deploy (production)

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_LOCATION: australiaeast
  RESOURCE_GROUP: rg-orqentis-production-aue

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment secrets (production)
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          KV_ADMIN_GROUP_OBJECT_ID: ${{ secrets.KV_ADMIN_GROUP_OBJECT_ID }}
          PG_ADMIN_PASSWORD_PROD: ${{ secrets.PG_ADMIN_PASSWORD_PROD }}
          ORQENTIS_APP_CLIENT_SECRET: ${{ secrets.ORQENTIS_APP_CLIENT_SECRET }}
          AZURE_STATIC_WEB_APPS_API_TOKEN_PROD: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_PROD }}
        run: |
          missing=()
          optional=()
          for key in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID KV_ADMIN_GROUP_OBJECT_ID PG_ADMIN_PASSWORD_PROD ORQENTIS_APP_CLIENT_SECRET; do
            if [ -z "${!key}" ]; then
              missing+=("$key")
            fi
          done

          if [ -z "$AZURE_STATIC_WEB_APPS_API_TOKEN_PROD" ]; then
            optional+=("AZURE_STATIC_WEB_APPS_API_TOKEN_PROD")
          fi

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required production secrets: ${missing[*]}"
            echo "::error::Set these in repository or environment secrets before re-running deploy-prod.yml."
            exit 1
          fi

          if [ ${#optional[@]} -gt 0 ]; then
            echo "::warning::Frontend (SWA) deployment will be skipped: ${optional[*]} not configured"
          fi

      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure production resource group
        run: |
          az group create \
            --name ${{ env.RESOURCE_GROUP }} \
            --location ${{ env.AZURE_LOCATION }}

      - name: What-if (production)
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ORQENTIS_APP_CLIENT_ID: 7a234404-ea08-454c-b2b5-0acb523f0417
          ORQENTIS_APP_CLIENT_SECRET: ${{ secrets.ORQENTIS_APP_CLIENT_SECRET }}
          PG_ADMIN_PASSWORD: ${{ secrets.PG_ADMIN_PASSWORD_PROD }}
        run: |
          az deployment group what-if \
            --name whatif-${{ github.run_id }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --template-file infra/main.bicep \
            --parameters infra/parameters/production.bicepparam \
            --parameters keyVaultAdminGroupObjectId=${{ secrets.KV_ADMIN_GROUP_OBJECT_ID }}

      - name: Deploy infrastructure
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ORQENTIS_APP_CLIENT_ID: 7a234404-ea08-454c-b2b5-0acb523f0417
          ORQENTIS_APP_CLIENT_SECRET: ${{ secrets.ORQENTIS_APP_CLIENT_SECRET }}
          PG_ADMIN_PASSWORD: ${{ secrets.PG_ADMIN_PASSWORD_PROD }}
        run: |
          az deployment group create \
            --name main-${{ github.run_id }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --template-file infra/main.bicep \
            --parameters infra/parameters/production.bicepparam \
            --parameters keyVaultAdminGroupObjectId=${{ secrets.KV_ADMIN_GROUP_OBJECT_ID }}

      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Build & publish API
        working-directory: backend
        run: dotnet publish Orqentis.Api/Orqentis.Api.csproj -c Release -o publish

      - name: Deploy API (slot swap)
        uses: azure/webapps-deploy@v3
        with:
          app-name: orqentis-production-api
          package: backend/publish

      - uses: actions/setup-node@v4
        with: { node-version: '20.x', cache: 'npm', cache-dependency-path: frontend/package-lock.json }
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Resolve frontend URL for workload package
        shell: bash
        run: |
          # fabric.orqentis.com is the registered tenant domain pointing to the workload SWA.
          # azurestaticapps.net URLs are rejected by Fabric manifest validation (not in tenant domain list).
          # AppId must be the Entra ID app registration client ID (a GUID), not the SWA resource ID.
          echo "ORQENTIS_WORKLOAD_FRONTEND_URL=https://fabric.orqentis.com" >> "$GITHUB_ENV"
          echo "ORQENTIS_WORKLOAD_FRONTEND_APP_ID=7a234404-ea08-454c-b2b5-0acb523f0417" >> "$GITHUB_ENV"

      - name: Install mono runtime for NuGet packaging
        run: |
          sudo apt-get update
          sudo apt-get install -y mono-complete

      - name: Package workload manifest
        shell: pwsh
        run: .\scripts\Publish-Workload.ps1 -SkipBuild

      - name: Upload workload package
        if: ${{ hashFiles('frontend/dist/manifest/*.nupkg') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: production-workload-package
          path: frontend/dist/manifest/*.nupkg
          retention-days: 30

      - name: Deploy frontend (Static Web Apps)
        if: ${{ env.SWA_TOKEN != '' }}
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend/dist
          output_location: ''
          skip_app_build: true

      - name: Skip frontend deployment (token missing)
        if: ${{ env.SWA_TOKEN == '' }}
        run: echo "Skipping Static Web Apps deploy because AZURE_STATIC_WEB_APPS_API_TOKEN_PROD is not set."



