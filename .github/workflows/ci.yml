name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  security-events: write

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20.x'

jobs:
  frontend:
    name: Frontend (lint + build + test)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test -- --reporter=dot
      # Frontend coverage baseline gate: Vitest must keep line coverage at or above 70%.
      - name: Enforce frontend coverage
        run: npm run test:coverage -- --reporter=dot --coverage.thresholds.lines=70
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser E2E tests
        run: npm run test:e2e -- --reporter=list

  backend:
    name: Backend (build + test + format)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - run: dotnet restore Orqentis.sln
      - run: dotnet format Orqentis.sln --verify-no-changes --no-restore
      - run: dotnet build Orqentis.sln --no-restore --configuration Release
      - run: dotnet test Orqentis.sln --no-build --configuration Release --collect:"XPlat Code Coverage" --logger "trx;LogFileName=test-results.trx"
      - name: Enforce Engine/AI coverage
        shell: pwsh
        run: ../scripts/Test-CoverageGate.ps1 -CoverageRoot . -MinimumLineCoverage 85
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/**/test-results.trx
          retention-days: 7

  contracts:
    name: Validate sample contracts (ODCS v3.1.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with: { python-version: '3.12' }
      - run: pip install datacontract-cli
      - name: Lint each example
        run: |
          set -e
          for f in contracts/examples/*.yaml; do
            echo "→ datacontract lint $f"
            datacontract lint "$f"
          done

  bicep:
    name: Validate Bicep templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bicep CLI
        run: az bicep install
      - name: Lint main.bicep
        run: az bicep build --file infra/main.bicep --stdout > /dev/null

  public-readiness:
    name: Public ISV readiness artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate public readiness package
        shell: pwsh
        run: ./scripts/Test-PublicReadiness.ps1


  security-scan:
    name: Security scan (SCA + SAST)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Restore backend packages
        working-directory: backend
        run: dotnet restore Orqentis.sln
      - name: Audit NuGet packages for high or critical vulnerabilities
        shell: pwsh
        working-directory: backend
        run: |
          $report = dotnet list Orqentis.sln package --vulnerable --include-transitive --format json | ConvertFrom-Json
          $findings = @()
          foreach ($project in $report.projects) {
            foreach ($framework in $project.frameworks) {
              foreach ($packageSetName in @('topLevelPackages', 'transitivePackages')) {
                foreach ($package in @($framework.$packageSetName)) {
                  foreach ($vulnerability in @($package.vulnerabilities)) {
                    if ($vulnerability.severity -in @('High', 'Critical')) {
                      $findings += [pscustomobject]@{
                        Project = $project.path
                        Package = $package.id
                        Version = $package.resolvedVersion
                        Severity = $vulnerability.severity
                        Advisory = $vulnerability.advisoryurl
                      }
                    }
                  }
                }
              }
            }
          }
          if ($findings.Count -gt 0) {
            $findings | Format-Table -AutoSize | Out-String | Write-Error
            exit 1
          }
          'No high or critical NuGet vulnerabilities found.'
      - name: Audit npm packages for high or critical vulnerabilities
        run: npm --prefix frontend audit --audit-level=high
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp,javascript-typescript
      - name: Autobuild CodeQL languages
        uses: github/codeql-action/autobuild@v3
      - name: Analyze CodeQL results
        uses: github/codeql-action/analyze@v3
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
