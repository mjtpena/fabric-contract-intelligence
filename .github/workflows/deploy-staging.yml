name: Deploy (staging)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_LOCATION: australiaeast
  RESOURCE_GROUP: rg-orqentis-staging-aue

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    env:
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_STAGING }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate deployment secrets (staging)
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          KV_ADMIN_GROUP_OBJECT_ID: ${{ secrets.KV_ADMIN_GROUP_OBJECT_ID }}
          PG_ADMIN_PASSWORD_STAGING: ${{ secrets.PG_ADMIN_PASSWORD_STAGING }}
          AZURE_STATIC_WEB_APPS_API_TOKEN_STAGING: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_STAGING }}
        run: |
          missing=()
          optional=()
          for key in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID KV_ADMIN_GROUP_OBJECT_ID PG_ADMIN_PASSWORD_STAGING; do
            if [ -z "${!key}" ]; then
              missing+=("$key")
            fi
          done
          
          if [ -z "$AZURE_STATIC_WEB_APPS_API_TOKEN_STAGING" ]; then
            optional+=("AZURE_STATIC_WEB_APPS_API_TOKEN_STAGING")
          fi

          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required staging secrets: ${missing[*]}"
            echo "::error::Set these in repository or environment secrets before re-running deploy-staging.yml."
            exit 1
          fi
          
          if [ ${#optional[@]} -gt 0 ]; then
            echo "::warning::Frontend (SWA) deployment will be skipped: ${optional[*]} not configured"
          fi

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure staging resource group
        run: |
          az group create \
            --name ${{ env.RESOURCE_GROUP }} \
            --location ${{ env.AZURE_LOCATION }}

      - name: Deploy infrastructure
        env:
          PG_ADMIN_PASSWORD: ${{ secrets.PG_ADMIN_PASSWORD_STAGING }}
        run: |
          az deployment group create \
            --name main-${{ github.run_id }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --template-file infra/main.bicep \
            --parameters infra/parameters/staging.bicepparam \
            --parameters keyVaultAdminGroupObjectId=${{ secrets.KV_ADMIN_GROUP_OBJECT_ID }}

      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Build & publish API
        working-directory: backend
        run: |
          dotnet publish Orqentis.Api/Orqentis.Api.csproj -c Release -o publish

      - name: Deploy API to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: orqentis-staging-api
          package: backend/publish

      - uses: actions/setup-node@v4
        with: { node-version: '20.x', cache: 'npm', cache-dependency-path: frontend/package-lock.json }
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Resolve frontend URL for workload package
        shell: bash
        run: |
          host=$(az staticwebapp list --resource-group "${{ env.RESOURCE_GROUP }}" --query "[0].defaultHostname" -o tsv)
          app_id=$(az staticwebapp list --resource-group "${{ env.RESOURCE_GROUP }}" --query "[0].id" -o tsv)
          if [ -z "$host" ]; then
            echo "ORQENTIS_WORKLOAD_FRONTEND_URL=https://fabric.orqentis.com" >> "$GITHUB_ENV"
          else
            echo "ORQENTIS_WORKLOAD_FRONTEND_URL=https://$host" >> "$GITHUB_ENV"
          fi
          if [ -n "$app_id" ]; then
            echo "ORQENTIS_WORKLOAD_FRONTEND_APP_ID=$app_id" >> "$GITHUB_ENV"
          fi

      - name: Package workload manifest
        shell: pwsh
        continue-on-error: true
        run: .\scripts\Publish-Workload.ps1 -SkipBuild

      - name: Upload workload package
        if: ${{ hashFiles('frontend/dist/manifest/*.nupkg') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: staging-workload-package
          path: frontend/dist/manifest/*.nupkg
          retention-days: 14

      - name: Deploy frontend (Static Web Apps)
        if: ${{ env.SWA_TOKEN != '' }}
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ env.SWA_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend
          output_location: dist
          skip_app_build: true

      - name: Skip frontend deployment (token missing)
        if: ${{ env.SWA_TOKEN == '' }}
        run: echo "Skipping Static Web Apps deploy because AZURE_STATIC_WEB_APPS_API_TOKEN_STAGING is not set."

