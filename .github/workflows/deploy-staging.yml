name: Deploy (staging)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AZURE_LOCATION: australiaeast
  RESOURCE_GROUP: rg-orqentis-staging-aue

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure
        env:
          PG_ADMIN_PASSWORD: ${{ secrets.PG_ADMIN_PASSWORD_STAGING }}
        run: |
          az deployment group create \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --template-file infra/main.bicep \
            --parameters infra/parameters/staging.bicepparam \
            --parameters keyVaultAdminGroupObjectId=${{ secrets.KV_ADMIN_GROUP_OBJECT_ID }}

      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Build & publish API
        working-directory: backend
        run: |
          dotnet publish Orqentis.Api/Orqentis.Api.csproj -c Release -o publish

      - name: Deploy API to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: orqentis-staging-api
          package: backend/publish

      - uses: actions/setup-node@v4
        with: { node-version: '20.x', cache: 'npm', cache-dependency-path: frontend/package-lock.json }
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Package workload manifest
        shell: pwsh
        run: .\scripts\Publish-Workload.ps1 -SkipBuild

      - name: Upload workload package
        uses: actions/upload-artifact@v4
        with:
          name: staging-workload-package
          path: frontend/dist/manifest/*.nupkg
          retention-days: 14

      - name: Deploy frontend (Static Web Apps)
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_STAGING }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend
          output_location: dist
          skip_app_build: true

  integration-tests:
    name: Integration tests (Fabric)
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }

      - name: Run integration tests
        run: dotnet test backend/Orqentis.Tests/Orqentis.Integration.Tests --logger:trx
        env:
          FABRIC_TEST_TENANT_ID: ${{ secrets.FABRIC_TEST_TENANT_ID }}
          FABRIC_TEST_WORKSPACE_ID: ${{ secrets.FABRIC_TEST_WORKSPACE_ID }}
          FABRIC_TEST_CAPACITY_ID: ${{ secrets.FABRIC_TEST_CAPACITY_ID }}
          FABRIC_TEST_API_BASE_URL: ${{ secrets.FABRIC_TEST_API_BASE_URL }}
          FABRIC_TEST_BEARER_TOKEN: ${{ secrets.FABRIC_TEST_BEARER_TOKEN }}
          FABRIC_TEST_PASSED_CONTRACT_ID: ${{ secrets.FABRIC_TEST_PASSED_CONTRACT_ID }}
          FABRIC_TEST_DRIFTED_CONTRACT_ID: ${{ secrets.FABRIC_TEST_DRIFTED_CONTRACT_ID }}

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-integration-test-results
          path: backend/Orqentis.Tests/Orqentis.Integration.Tests/TestResults/**/*.trx
          retention-days: 7
