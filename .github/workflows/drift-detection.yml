name: Drift detection

on:
  schedule:
    - cron: '0 19 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

env:
  RESOURCE_GROUP: rg-orqentis-production-aue

jobs:
  production-what-if:
    name: Production Bicep what-if
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Azure login (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Run production what-if
        id: whatif
        shell: bash
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ORQENTIS_APP_CLIENT_ID: 7a234404-ea08-454c-b2b5-0acb523f0417
          ORQENTIS_APP_CLIENT_SECRET: ${{ secrets.ORQENTIS_APP_CLIENT_SECRET }}
          PG_ADMIN_PASSWORD: ${{ secrets.PG_ADMIN_PASSWORD_PROD }}
        run: |
          set +e
          output=$(az deployment group what-if \
            --name drift-${{ github.run_id }} \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --template-file infra/main.bicep \
            --parameters infra/parameters/production.bicepparam \
            --parameters keyVaultAdminGroupObjectId=${{ secrets.KV_ADMIN_GROUP_OBJECT_ID }} 2>&1)
          status=$?
          set -e
          {
            echo 'body<<EOF'
            echo "$output"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          if [ $status -ne 0 ]; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$output" | grep -E '^[[:space:]]*[~+\-]|Resource changes:'; then
            echo "drift=true" >> "$GITHUB_OUTPUT"
          else
            echo "drift=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create drift issue
        if: steps.whatif.outputs.drift == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `Production drift detection found changes or what-if errors.\n\n\`\`\`text\n${{ steps.whatif.outputs.body }}\n\`\`\``;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Production drift detected - ${new Date().toISOString().slice(0, 10)}`,
              body,
              labels: ['ops', 'drift']
            });
