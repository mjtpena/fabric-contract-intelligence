      - auto
    groups:
      nuget-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: nuget
    directory: /backend/Orqentis.Tests/Orqentis.Integration.Tests
    schedule:
      interval: daily
    open-pull-requests-limit: 5
