version: 2
updates:
  - package-ecosystem: nuget
    directory: /backend/Orqentis.Api
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - auto
    groups:
      nuget-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: nuget
    directory: /backend/Orqentis.AI
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - auto
    groups:
      nuget-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: nuget
    directory: /backend/Orqentis.Data
    schedule:
      interval: daily
    open-pull-requests-limit: 5
    labels:
      - dependencies
