    open-pull-requests-limit: 5
    labels:
      - dependencies
      - auto
    groups:
      nuget-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: nuget
    directory: /backend/Orqentis.Tests
    schedule:
